[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_PUBLIC_SITE_URL = "https://invitra-ai.netlify.app"
  # Netlify's Next.js runtime handles SSR, ISR and the image CDN.
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Security headers.
#
# No Content-Security-Policy here on purpose: Next.js emits inline bootstrap
# scripts, so a correct policy needs per-request nonces via middleware. Adding
# one blind would either break the app or be theatre. See the README for how to
# add it properly once you can test against the real deploy.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Published invitations are private by nature — keep them out of indexes even
# if someone links to one publicly.
[[headers]]
  for = "/i/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
